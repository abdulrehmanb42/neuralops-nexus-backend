# =============================================================================
# docker-compose.neuralops.yaml — the new unified-image stack. Separate from
# docker-compose.yaml (the existing dev/fat split), which is untouched.
#
# One shared image (`neuralops`) contains nucleus + nexus-ai + centrifugo +
# the filesystem MCP — see neuralops/Dockerfile. Each is its own
# service/container here, distinguished only by `command:`. Postgres, redis,
# chromadb, and nginx stay separate, using their official images.
#
# Two profiles:
#   production (default) — pulls the neuralops image from Docker Hub, no
#     build, no source tree required. This is what COMPOSE_PROFILES defaults
#     to in neuralops/infra.env.example.
#   dev — builds the neuralops image locally, then bind-mounts
#     modules/nexus-nucleus and modules/nexus-ai over the baked-in code paths
#     for live editing. Infra (postgres/redis/chromadb/nginx) is still
#     pulled, not rebuilt, in dev too.
#
# Secrets note: SUPABASE_*, NEURALOPS_PORTAL_URL, and NEURALOPS_VERSION are
# deliberately NOT set anywhere in this file — they're baked into the
# neuralops image itself (see neuralops/Dockerfile), one shared default for
# every deployment (SUPABASE_URL/ANON_KEY genuinely are shared -- one real
# Supabase project every deployment's login talks to). There is also no
# OPENAI_API_KEY/ANTHROPIC_API_KEY anywhere in this file on purpose — no
# shared default exists for those, ever; nucleus's /add-model UI is the
# real path for those, not an env var.
#
# FIELD_ENCRYPTION_KEY, INTERNAL_API_KEY, CENTRIFUGO_API_KEY,
# CENTRIFUGO_HMAC_SECRET, and POSTGRES_PASSWORD are the opposite: genuinely
# per-deployment secrets, generated ONCE per deployment before first run:
#
#   docker run --rm ${NEURALOPS_IMAGE:-noamanfaisal/neuralops:latest} init-secrets > neuralops/secrets.env
#
# POSTGRES_PASSWORD joined this list to close a real gap: infra.env.example
# used to ship a literal example password, and with no generator, nothing
# stopped every self-hosted deployment from sharing that same value — worse,
# postgres publishes a host port, so a shared password wasn't just a
# theoretical risk. POSTGRES_DB/POSTGRES_USER stay in infra.env — plain
# identifiers, not secrets, safe to leave as shared defaults or change by
# hand for minor extra hardening.
#
# Reliability note: every app service that needs any of these five values
# (nucleus, nucleus-celery, nucleus-celery-beat, nexus-ai, centrifugo,
# postgres, and their -dev counterparts) loads neuralops/secrets.env
# directly via its own `env_file:` key below, not through ${VAR} references.
# This means these values get loaded at container-creation time regardless
# of what flags anyone types on the `up` command line — a forgotten
# --env-file neuralops/secrets.env flag can no longer silently leave them
# blank (Compose would otherwise just warn and substitute an empty string,
# which surfaces later as a confusing auth failure, not an obvious error).
# One accepted trade-off: nexus-ai receives all five secrets this way even
# though it only uses INTERNAL_API_KEY directly — env_file: loads a whole
# file, not individual keys — and nexus-ai spawns MCP server subprocesses,
# which inherit their parent's environment by default. Chosen deliberately
# in favor of consistent reliability across every service; splitting
# secrets.env into a smaller per-service file is the way to get both
# precision and reliability later, if that trade-off ever needs revisiting.
# Because every consumer now reads this file via env_file: rather than
# ${VAR} interpolation, --env-file neuralops/secrets.env in the run command
# below is technically redundant now — kept anyway, harmless, and keeps the
# command self-documenting.
#
# NEURALOPS_SERVER_URL note (production only -- dev still uses ${VAR}, see
# below): this hit the exact same reliability gap as the five secrets above
# -- nucleus and centrifugo used to read it via ${NEURALOPS_SERVER_URL}
# interpolation, so a `docker compose up`/`create` run without
# --env-file neuralops/app.env in scope silently left it blank instead of
# erroring. Fixed the same way: nucleus now loads neuralops/app.env directly
# via env_file: (same variable name on both sides, so no extra step needed).
# centrifugo is trickier -- nexus-transport reads the config key as
# CENTRIFUGO_ALLOWED_ORIGINS, a DIFFERENT name than NEURALOPS_SERVER_URL, and
# env_file: can only load a variable under its own name, not rename it (only
# ${VAR} interpolation can remap names, which is the exact fragility being
# removed here). So app.env now also carries an explicit
# CENTRIFUGO_ALLOWED_ORIGINS line -- same value as NEURALOPS_SERVER_URL, set
# once by hand in neuralops/app.env, not derived -- and centrifugo loads
# app.env via env_file: too. Keep the two values identical when either one
# changes; see the comment in neuralops/app.env.example.
#
# Project files note: nexus-ai's /nexus/projects is a BIND MOUNT to ./projects
# (repo root, sibling to this file), not a named volume — deliberately, so a
# self-hoster can see, edit, and back up their actual project files/code as
# a normal folder instead of hunting through Docker's internal volume
# storage. postgres/redis/chromadb/fastembed-cache data stay as named
# volumes; only projects changed. This has one real consequence: nexus-ai
# runs as a non-root user (UID 1000, the `nexus` user baked into the image —
# see neuralops/Dockerfile's `ARG UID=1000`) with no privileges to fix
# directory ownership itself at startup, unlike named volumes (which inherit
# the image's own ownership on first mount) or the official postgres image
# (whose entrypoint runs as root initially and fixes its own data directory
# ownership). A bind-mounted host folder gets none of that — whatever
# ownership it has on the host is exactly what the container sees. Create
# and own it BEFORE the first `up`:
#
#   mkdir -p ./projects
#   sudo chown -R 1000:1000 ./projects
#
# Skipping this isn't fatal but is confusing: Compose will auto-create
# ./projects as root-owned if it doesn't exist, and nexus-ai will then fail
# to write into it — fixable after the fact by running the same chown
# command and restarting the nexus-ai container, but doing it up front
# avoids hitting that failure at all. ./projects is git-ignored (see
# .gitignore) since it holds real project files/code, never repo content.
#
# Run with (see neuralops/app.env.example + neuralops/infra.env.example —
# copy both to neuralops/app.env + neuralops/infra.env first, filled in with
# real values. NOT the repo's existing .env, which belongs to the old
# docker-compose.yaml and would collide on COMPOSE_PROFILES/DEV_* var names
# if auto-loaded here):
#
#   docker compose -f docker-compose.neuralops.yaml \
#     --env-file neuralops/infra.env --env-file neuralops/app.env \
#     --env-file neuralops/secrets.env up -d
#
# Same internal-DNS rule as docker-compose.yaml: containers resolve each
# other by Compose *service name* only, never container_name — every
# internal URL below is a service name on purpose.
# =============================================================================

services:

  # ===========================================================================
  # PRODUCTION profile — pulled image, no build, no source tree needed.
  # ===========================================================================

  nucleus:
    image: ${NEURALOPS_IMAGE:-noamanfaisal/neuralops:latest}
    profiles: ["production"]
    container_name: neuralops-nucleus
    command: ["nucleus-env", "uvicorn", "core.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    env_file:
      - ./neuralops/secrets.env
      - ./neuralops/app.env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - REDIS_URL=redis://redis:6379/0
      - NEXUS_AI_URL=http://nexus-ai:8000
      - CENTRIFUGO_API_URL=http://centrifugo:8000/api
    networks:
      - neuralops-network
    depends_on:
      - postgres
      - redis
      - centrifugo

  nucleus-celery:
    image: ${NEURALOPS_IMAGE:-noamanfaisal/neuralops:latest}
    profiles: ["production"]
    container_name: neuralops-nucleus-celery
    command: ["nucleus-env", "celery", "-A", "core", "worker", "-l", "info"]
    restart: unless-stopped
    env_file:
      - ./neuralops/secrets.env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - REDIS_URL=redis://redis:6379/0
      - NEXUS_AI_URL=http://nexus-ai:8000
      - CENTRIFUGO_API_URL=http://centrifugo:8000/api
    networks:
      - neuralops-network
    depends_on:
      - postgres
      - redis

  nucleus-celery-beat:
    image: ${NEURALOPS_IMAGE:-noamanfaisal/neuralops:latest}
    profiles: ["production"]
    container_name: neuralops-nucleus-celery-beat
    command: ["nucleus-env", "celery", "-A", "core", "beat", "-l", "info"]
    restart: unless-stopped
    env_file:
      - ./neuralops/secrets.env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - REDIS_URL=redis://redis:6379/0
    networks:
      - neuralops-network
    depends_on:
      - postgres
      - redis

  nexus-ai:
    image: ${NEURALOPS_IMAGE:-noamanfaisal/neuralops:latest}
    profiles: ["production"]
    container_name: neuralops-nexus-ai
    command: ["nexus-ai-env", "python3", "-m", "uvicorn", "apps.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${NEXUS_AI_HOST_PORT:-8020}:8000"
    volumes:
      - neuralops_fastembed_cache:/home/nexus/.cache/fastembed
      - ./projects:/nexus/projects
    env_file:
      - ./neuralops/secrets.env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-fastembed}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - NEXUS_NUCLEUS_URL=http://nucleus:8000
    networks:
      - neuralops-network
    depends_on:
      - chromadb
      - nucleus

  centrifugo:
    image: ${NEURALOPS_IMAGE:-noamanfaisal/neuralops:latest}
    profiles: ["production"]
    container_name: neuralops-centrifugo
    command: ["centrifugo", "nexus-transport", "--admin.enabled", "--admin.insecure", "--client.insecure", "--http_api.insecure"]
    env_file:
      - ./neuralops/secrets.env
      - ./neuralops/app.env
    networks:
      - neuralops-network
    depends_on:
      - redis

  postgres:
    image: postgres:17-alpine
    profiles: ["production"]
    container_name: neuralops-postgres
    restart: always
    env_file:
      - ./neuralops/secrets.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
    ports:
      - "${POSTGRES_HOST_PORT:-5495}:5432"
    volumes:
      - neuralops_postgres_data:/var/lib/postgresql/data
    networks:
      - neuralops-network

  redis:
    image: redis:7-alpine
    profiles: ["production"]
    container_name: neuralops-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6395}:6379"
    volumes:
      - neuralops_redis_data:/data
    networks:
      - neuralops-network

  chromadb:
    image: chromadb/chroma:latest
    profiles: ["production"]
    container_name: neuralops-chromadb
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      - neuralops_chroma_data:/chroma/chroma
    networks:
      - neuralops-network

  nginx:
    image: nginx:alpine
    profiles: ["production"]
    container_name: neuralops-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-8095}:80"
    volumes:
      - ./neuralops/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - neuralops-network
    depends_on:
      - nucleus
      - centrifugo

  # ===========================================================================
  # DEV profile — image built locally, app code bind-mounted over the baked-in
  # copy for live editing. Infra still pulled, not rebuilt.
  # NOTE: dev profile deliberately left untouched by the env_file: hardening
  # passes (secrets and NEURALOPS_SERVER_URL both) -- tracked separately.
  # ===========================================================================

  nucleus-dev:
    build:
      context: .
      dockerfile: neuralops/Dockerfile
    image: neuralops:dev-local
    profiles: ["dev"]
    container_name: neuralops-nucleus-dev
    command: ["nucleus-env", "uvicorn", "core.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./modules/nexus-nucleus:/nexus/nucleus
    env_file:
      - ./neuralops/secrets.env
    environment:
      - POSTGRES_HOST=postgres-dev
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - REDIS_URL=redis://redis-dev:6379/0
      - NEXUS_AI_URL=http://nexus-ai-dev:8000
      - CENTRIFUGO_API_URL=http://centrifugo-dev:8000/api
      - NEURALOPS_SERVER_URL=${NEURALOPS_SERVER_URL}
      - NEURALOPS_VERSION=dev
    networks:
      - neuralops-network
    depends_on:
      - postgres-dev
      - redis-dev
      - centrifugo-dev

  nucleus-celery-dev:
    build:
      context: .
      dockerfile: neuralops/Dockerfile
    image: neuralops:dev-local
    profiles: ["dev"]
    container_name: neuralops-nucleus-celery-dev
    command: ["nucleus-env", "celery", "-A", "core", "worker", "-l", "info"]
    restart: unless-stopped
    volumes:
      - ./modules/nexus-nucleus:/nexus/nucleus
    env_file:
      - ./neuralops/secrets.env
    environment:
      - POSTGRES_HOST=postgres-dev
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - REDIS_URL=redis://redis-dev:6379/0
      - NEXUS_AI_URL=http://nexus-ai-dev:8000
      - CENTRIFUGO_API_URL=http://centrifugo-dev:8000/api
    networks:
      - neuralops-network
    depends_on:
      - postgres-dev
      - redis-dev

  nucleus-celery-beat-dev:
    build:
      context: .
      dockerfile: neuralops/Dockerfile
    image: neuralops:dev-local
    profiles: ["dev"]
    container_name: neuralops-nucleus-celery-beat-dev
    command: ["nucleus-env", "celery", "-A", "core", "beat", "-l", "info"]
    restart: unless-stopped
    volumes:
      - ./modules/nexus-nucleus:/nexus/nucleus
    env_file:
      - ./neuralops/secrets.env
    environment:
      - POSTGRES_HOST=postgres-dev
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - REDIS_URL=redis://redis-dev:6379/0
    networks:
      - neuralops-network
    depends_on:
      - postgres-dev
      - redis-dev

  nexus-ai-dev:
    build:
      context: .
      dockerfile: neuralops/Dockerfile
    image: neuralops:dev-local
    profiles: ["dev"]
    container_name: neuralops-nexus-ai-dev
    command: ["nexus-ai-env", "python3", "-m", "uvicorn", "apps.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${DEV_NEXUS_AI_HOST_PORT:-8021}:8000"
    # host.docker.internal -- stdio MCP servers spawned as subprocesses of
    # THIS container may target the host machine itself -- same reasoning
    # as the existing nexus-ai-dev service in docker-compose.yaml.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./modules/nexus-ai:/nexus/ai
      - neuralops_fastembed_cache_dev:/home/nexus/.cache/fastembed
      - neuralops_projects_dev:/nexus/projects
    env_file:
      - ./neuralops/secrets.env
    environment:
      - CHROMA_HOST=chromadb-dev
      - CHROMA_PORT=8000
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-fastembed}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - NEXUS_NUCLEUS_URL=http://nucleus-dev:8000
    networks:
      - neuralops-network
    depends_on:
      - chromadb-dev
      - nucleus-dev

  centrifugo-dev:
    build:
      context: .
      dockerfile: neuralops/Dockerfile
    image: neuralops:dev-local
    profiles: ["dev"]
    container_name: neuralops-centrifugo-dev
    command: ["centrifugo", "nexus-transport", "--admin.enabled", "--admin.insecure", "--client.insecure", "--http_api.insecure"]
    env_file:
      - ./neuralops/secrets.env
    environment:
      - CENTRIFUGO_ALLOWED_ORIGINS=${NEURALOPS_SERVER_URL}
    networks:
      - neuralops-network
    depends_on:
      - redis-dev

  postgres-dev:
    image: postgres:17-alpine
    profiles: ["dev"]
    container_name: neuralops-postgres-dev
    restart: always
    env_file:
      - ./neuralops/secrets.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
    ports:
      - "${DEV_POSTGRES_HOST_PORT:-5496}:5432"
    volumes:
      - neuralops_postgres_data_dev:/var/lib/postgresql/data
    networks:
      - neuralops-network

  redis-dev:
    image: redis:7-alpine
    profiles: ["dev"]
    container_name: neuralops-redis-dev
    restart: unless-stopped
    ports:
      - "${DEV_REDIS_HOST_PORT:-6396}:6379"
    volumes:
      - neuralops_redis_data_dev:/data
    networks:
      - neuralops-network

  chromadb-dev:
    image: chromadb/chroma:latest
    profiles: ["dev"]
    container_name: neuralops-chromadb-dev
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      - neuralops_chroma_data_dev:/chroma/chroma
    networks:
      - neuralops-network

  nginx-dev:
    image: nginx:alpine
    profiles: ["dev"]
    container_name: neuralops-nginx-dev
    restart: unless-stopped
    ports:
      - "${DEV_NGINX_HOST_PORT:-8096}:80"
    volumes:
      - ./neuralops/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    networks:
      - neuralops-network
    depends_on:
      - nucleus-dev
      - centrifugo-dev

networks:
  neuralops-network:
    name: neuralops-network
    driver: bridge

volumes:
  neuralops_postgres_data:
  neuralops_redis_data:
  neuralops_chroma_data:
  neuralops_fastembed_cache:
  neuralops_postgres_data_dev:
  neuralops_redis_data_dev:
  neuralops_chroma_data_dev:
  neuralops_fastembed_cache_dev:
  neuralops_projects_dev:
