# NeuralOps MCP Services — standalone, no dependency on main project
# Each service has its own code and Dockerfile inside this folder.
#
# Usage:
#   cd /data/code/neuralops-staging/mcps
#   docker compose up -d
#
# Networking: every service here joins BOTH mcp-network (its own isolated
# bridge) AND fat-network (external -- the same network nucleus-fat/
# nexus-ai-fat run on, created by the main docker-compose.yaml's fat
# profile). Without fat-network, nexus-ai-fat cannot reach these
# containers at all -- MCP tool calls fail with "Client failed to
# connect: All connection attempts failed", since separate Docker
# networks are isolated from each other by default (see DECISIONS.md).
# fat-network must already exist (i.e. the fat profile must be up)
# before running `docker compose up -d` here, or this will error.
#
# Add to NeuralOps via /add_mcp (transport: http), using the CONTAINER
# NAME over fat-network -- not localhost, and not the host-published
# port, which are for reaching these directly from the host, not from
# nexus-ai-fat's container network namespace:
#   SerpAPI    → http://serp-mcp:8000/mcp
#   Odoo ERP   → http://odoo-mcp:8000/mcp
#   Filesystem → http://filesystem-mcp:8000/mcp
#
# (The host-published ports below -- 9043/9044/9045 -- are only useful
# for curl-testing from the host itself, e.g. `curl localhost:9045/mcp`.)
#
# Required env vars — create a .env file in this folder:
#   SERPAPI_KEY
#   ERP_URL, ERP_DB, ERP_USERNAME, ERP_PASSWORD
#   FILESYSTEM_ROOT   (host path to expose via filesystem MCP, default: /data)

services:

  # ── SerpAPI / Shopping MCP ──────────────────────────────────────────────
  serp-mcp:
    build:
      context: ./serp
    container_name: serp-mcp
    ports:
      - "9043:8000"
    environment:
      - SERPAPI_KEY=${SERPAPI_KEY:-}
    networks:
      - mcp-network
      - fat-network
    restart: unless-stopped

  # ── Odoo ERP MCP ────────────────────────────────────────────────────────
  odoo-mcp:
    build:
      context: ./odoo
    container_name: odoo-mcp
    ports:
      - "9044:8000"
    environment:
      - ERP_URL=${ERP_URL:-}
      - ERP_DB=${ERP_DB:-odoo}
      - ERP_USERNAME=${ERP_USERNAME:-admin}
      - ERP_PASSWORD=${ERP_PASSWORD:-admin}
    networks:
      - mcp-network
      - fat-network
    restart: unless-stopped

  # ── Filesystem MCP (official @modelcontextprotocol/server-filesystem) ──
  # Exposes FILESYSTEM_ROOT as read-only /files inside the container.
  # supergateway wraps the stdio MCP server as streamable-http.
  filesystem-mcp:
    image: node:22-slim
    container_name: filesystem-mcp
    command:
      [
        "sh",
        "-c",
        "npx -y supergateway --port 8000 --outputTransport streamableHttp --stdio 'npx -y @modelcontextprotocol/server-filesystem /files'",
      ]
    ports:
      - "9045:8000"
    volumes:
      - ${FILESYSTEM_ROOT:-/data}:/files:ro
    networks:
      - mcp-network
      - fat-network
    restart: unless-stopped

networks:
  mcp-network:
    driver: bridge
  # External: must already exist -- created by the main docker-compose.yaml
  # when the fat profile is brought up (`docker compose --profile fat up -d`).
  # `external: true` makes Compose error clearly if it's missing instead of
  # silently creating a second, disconnected network with the same name.
  fat-network:
    external: true
