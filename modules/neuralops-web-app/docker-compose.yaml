# Standalone compose for neuralops-app. Run from this directory.
#   Dev (hot reload):  docker compose up app-dev
#   Prod image:        docker compose up app
services:
  app-dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "${NEURALOPS_APP_DEV_PORT:-3000}:3000"
    volumes:
      - ./:/app
      # Named volume keeps Linux-built node_modules off the macOS bind mount.
      - node_modules:/app/node_modules
    environment:
      - WATCHPACK_POLLING=true

  app:
    build: .
    ports:
      - "${NEURALOPS_APP_PORT:-3100}:3000"

volumes:
  node_modules:
