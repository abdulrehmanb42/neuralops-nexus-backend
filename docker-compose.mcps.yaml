# =============================================================================
# docker-compose.mcps.yaml — external MCP tool servers for the unified stack.
#
# Companion to docker-compose.neuralops.yaml. Separate file on purpose: these
# are optional integrations, each needing its own third-party credentials, and
# a deployment should be able to run none, some, or all of them without
# touching the main stack.
#
# Relationship to mcps/docker-compose.yaml (the older one): same idea and the
# same supergateway trick, but that file joins `fat-network` (the superseded
# fat profile) and only carries serp/odoo/filesystem. This one joins
# `neuralops-network` and adds monday + jira.
#
# ── Why HTTP and not stdio ───────────────────────────────────────────────────
# Every server here speaks streamable-http. That is deliberate, not stylistic.
# nexus-ai's _run_with_mcp() builds stdio transports as:
#
#     StdioTransport(command=..., args=..., env=s.secrets or None)
#
# When an MCPServer record has secrets, the spawned subprocess receives ONLY
# those variables as its entire environment — including no PATH — so the
# executable can't be found and the server never starts. Any MCP server that
# needs a token is therefore effectively unusable over stdio here. Running
# them as their own containers lets each hold its token in its own
# environment, and NeuralOps just talks to a URL.
#
# The baked-in filesystem MCP is the exception and stays stdio: it needs no
# secrets, so env is None and it inherits PATH normally.
#
# ── Usage ────────────────────────────────────────────────────────────────────
# The main stack must be up first, so `neuralops-network` exists:
#
#   cp mcps.env.example mcps.env      # then fill in the tokens you have
#   docker compose -f docker-compose.mcps.yaml --env-file mcps.env up -d
#
# ── Registering in NeuralOps ─────────────────────────────────────────────────
# /add-mcp with transport=http, using the CONTAINER NAME over
# neuralops-network — not localhost, and not the host-published port. Tool
# calls originate inside nexus-ai's network namespace, where localhost is
# nexus-ai itself:
#
#   Monday  → http://monday-mcp:8000/mcp
#   Jira    → http://jira-mcp:9000/mcp
#   Web     → http://serp-mcp:8000/mcp
#
# Host ports below are bound to 127.0.0.1 for curl-testing from the host only
# — these carry live third-party credentials and must not be internet-facing.
# =============================================================================

services:

  # ── Monday.com ──────────────────────────────────────────────────────────
  # Official npm package (@mondaydotcomorg/monday-api-mcp) is stdio-only, so
  # supergateway wraps it as streamable-http — same pattern as the
  # filesystem-mcp service in mcps/docker-compose.yaml.
  monday-mcp:
    image: node:22-slim
    container_name: monday-mcp
    command:
      - sh
      - -c
      - >
        npx -y supergateway --port 8000
        --outputTransport streamableHttp
        --stdio "npx -y @mondaydotcomorg/monday-api-mcp -t $$MONDAY_TOKEN"
    environment:
      - MONDAY_TOKEN=${MONDAY_TOKEN:-}
    ports:
      - "127.0.0.1:9046:8000"
    networks:
      - neuralops-network
    restart: unless-stopped

  # ── Jira / Confluence ───────────────────────────────────────────────────
  # sooperset/mcp-atlassian speaks streamable-http natively — no supergateway
  # wrapper needed.
  #
  # API-token auth, NOT OAuth. Atlassian's own remote MCP server is OAuth 2.1
  # first, and NeuralOps has no OAuth flow (no consent redirect, no token
  # refresh), so the API-token path is the only one that works here.
  jira-mcp:
    image: ghcr.io/sooperset/mcp-atlassian:latest
    container_name: jira-mcp
    command: ["--transport", "streamable-http", "--port", "9000", "-vv"]
    environment:
      - JIRA_URL=${JIRA_URL:-}
      - JIRA_USERNAME=${JIRA_USERNAME:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      # Required. Over HTTP transports this image defaults to multi-user mode:
      # every request must carry its own Authorization header, and requests
      # without one are rejected outright -- surfacing as
      #   {"error": "Authentication required: no Atlassian credentials were provided."}
      # even when JIRA_* above are set correctly. This flag lets a request with
      # no header fall back to the server-side credentials, i.e. single-user
      # mode, which is what we want here.
      #
      # Not optional for NeuralOps specifically: MCPServer has no field for a
      # per-request Authorization header on http/sse transports (see
      # nucleus/models/intelligence.py -- only url, command, and the encrypted
      # secrets dict, and secrets are only wired into stdio subprocesses by
      # nexus-ai's _run_with_mcp). Without this, a persona can never
      # authenticate against this server at all.
      - ALLOW_GLOBAL_CRED_FALLBACK=true
    ports:
      - "127.0.0.1:9047:9000"
    networks:
      - neuralops-network
    restart: unless-stopped

  # ── Web search (SerpAPI) ────────────────────────────────────────────────
  # Built from this repo's own mcps/serp/ folder, so the build context is
  # relative to the repo root — run compose from there.
  serp-mcp:
    build:
      context: ./mcps/serp
    container_name: serp-mcp
    environment:
      - SERPAPI_KEY=${SERPAPI_KEY:-}
    ports:
      - "127.0.0.1:9043:8000"
    networks:
      - neuralops-network
    restart: unless-stopped

networks:
  # External: created by docker-compose.neuralops.yaml. Bring the main stack
  # up first. `external: true` makes Compose fail loudly if it's missing,
  # rather than silently creating a second, disconnected network of the same
  # name that nexus-ai isn't on — which would surface as "Client failed to
  # connect: All connection attempts failed" on every tool call.
  neuralops-network:
    external: true
