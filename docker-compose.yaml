# =============================================================================
# NeuralOps — single compose file, profile-selected stacks. See #143 / #170 /
# TASKS.md / DECISIONS.md §20.
#
#   docker compose up -d                  # dev stack (COMPOSE_PROFILES=dev in .env)
#   docker compose --profile fat up -d    # fat stack — pre-built Docker Hub images, no source needed
#
# production is still deferred, not built yet. When it's ready, it gets added
# back as a straight copy of the dev-*/fat-* blocks below (same shape, own
# names/ports/data/secrets under a PROD_* prefix) -- same pattern, just not
# needed today.
#
# fat profile notes (#170, full rationale in DECISIONS.md §20):
#   - No frontend service. Self-hosters connect the hosted frontend to their
#     server instead of running a local UI.
#   - Every fat-* service uses image: only, no build: key -- there is
#     deliberately no source tree required to run the fat profile. Images
#     are built from docker/fat/Dockerfile.* (and the per-module ones under
#     modules/*/docker/fat/) in this repo and pushed to Docker Hub as
#     noamanfaisal/neuralops-{nucleus,nexus-ai,nginx}:${FAT_VERSION}.
#   - nginx-fat bakes nginx.conf into the image at build time (no bind
#     mount) for the same "no source tree" reason.
#
# All config lives in .env, using DEV_*/FAT_* prefixed variable names.
# Internal service-to-service URLs (e.g. nucleus -> chromadb) are hardcoded
# literals, NOT env vars -- those are structural, not secrets, and DNS
# between containers only resolves by Compose *service name*, never by
# container_name (see #131's incident notes in TASKS.md) -- every internal
# URL below uses the service name on purpose.
# =============================================================================

services:

  nucleus-dev:
    image: nexus-backend:5.0
    build:
      context: .
      dockerfile: modules/nexus-nucleus/docker/dev/Dockerfile.nexus-nucleus
    profiles: ["dev"]
    container_name: dev-nucleus
    volumes:
      - ./modules/nexus-nucleus:/nexus-nucleus
    working_dir: /nexus-nucleus
    command: >-
      uvicorn core.asgi:application
      --host 0.0.0.0
      --port 8000
      --reload
    environment:
      - POSTGRES_USER=${DEV_POSTGRES_USER}
      - POSTGRES_PASSWORD=${DEV_POSTGRES_PASSWORD}
      - POSTGRES_DB=${DEV_POSTGRES_DB}
      - POSTGRES_URL=${DEV_POSTGRES_URL}
      - POSTGRES_HOST=postgres-dev
      - NEXUS_AI_URL=http://nexus-ai-dev:8000
      - FIELD_ENCRYPTION_KEY=${DEV_FIELD_ENCRYPTION_KEY}
      - INTERNAL_API_KEY=${DEV_INTERNAL_API_KEY}
      - CENTRIFUGO_API_URL=http://realtime-dev:8000/api
      - CENTRIFUGO_API_KEY=${DEV_CENTRIFUGO_API_KEY}
      - CENTRIFUGO_HMAC_SECRET=${DEV_CENTRIFUGO_HMAC_SECRET}
      - REDIS_URL=redis://redis-dev:6379/0
      - SUPABASE_ANON_KEY=${DEV_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${DEV_SUPABASE_SERVICE_KEY}
      - NEURALOPS_INSTALL_TOKEN=${DEV_NEURALOPS_INSTALL_TOKEN}
      - NEURALOPS_PORTAL_URL=${DEV_NEURALOPS_PORTAL_URL:-https://neuralops-nexus-auth.mapax.io}
      - NEURALOPS_SERVER_URL=${DEV_NEURALOPS_SERVER_URL}
      - NEURALOPS_VERSION=dev
      - PYTHONPATH=/nexus-nucleus
    networks:
      - dev-network
    depends_on:
      - postgres-dev
      - redis-dev
      - realtime-dev

  nucleus-celery-dev:
    image: nexus-backend:5.0
    build:
      context: .
      dockerfile: modules/nexus-nucleus/docker/dev/Dockerfile.nexus-nucleus
    profiles: ["dev"]
    container_name: dev-celery
    volumes:
      - ./modules/nexus-nucleus:/nexus-nucleus
    working_dir: /nexus-nucleus
    command: tail -f /dev/null
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DEV_POSTGRES_USER}
      - POSTGRES_PASSWORD=${DEV_POSTGRES_PASSWORD}
      - POSTGRES_DB=${DEV_POSTGRES_DB}
      - POSTGRES_URL=${DEV_POSTGRES_URL}
      - POSTGRES_HOST=postgres-dev
      - REDIS_URL=redis://redis-dev:6379/0
      - SUPABASE_ANON_KEY=${DEV_SUPABASE_ANON_KEY}
      - NEURALOPS_INSTALL_TOKEN=${DEV_NEURALOPS_INSTALL_TOKEN}
      - PYTHONPATH=/nexus-nucleus
    networks:
      - dev-network
    depends_on:
      - postgres-dev
      - redis-dev

  redis-dev:
    image: redis:7-alpine
    profiles: ["dev"]
    container_name: dev-redis
    restart: unless-stopped
    ports:
      - "${DEV_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - ./data/dev/redis_data:/data
    networks:
      - dev-network

  nexus-ai-dev:
    image: nexus-ai:2.0
    build:
      context: .
      dockerfile: modules/nexus-ai/docker/dev/Dockerfile.nexus-ai
    profiles: ["dev"]
    container_name: dev-nexus-ai
    ports:
      - "${DEV_NEXUS_AI_HOST_PORT:-8000}:8000"
    volumes:
      - ./modules/nexus-ai:/nexus-ai
      - ./data/dev/fastembed_cache:/root/.cache/fastembed
    working_dir: /nexus-ai
    command: >
      sh -c "export PYTHONPATH=$PYTHONPATH:/nexus-ai &&
             python3 -m uvicorn apps.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - CHROMA_HOST=chromadb-dev
      - CHROMA_PORT=8000
      - OPENAI_API_KEY=${DEV_OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${DEV_ANTHROPIC_API_KEY}
      - LLM_MODEL=${DEV_LLM_MODEL:-anthropic/claude-haiku-4-5-20251001}
      - EMBEDDING_PROVIDER=${DEV_EMBEDDING_PROVIDER:-fastembed}
      - EMBEDDING_MODEL=${DEV_EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      - EMBEDDING_BASE_URL=${DEV_EMBEDDING_BASE_URL:-}
      - OLLAMA_BASE_URL=${DEV_OLLAMA_BASE_URL:-http://nexus-ollama:11434}
      - INTERNAL_API_KEY=${DEV_INTERNAL_API_KEY}
      - NEXUS_NUCLEUS_URL=http://nucleus-dev:8000
      - PYTHONPATH=/nexus-ai
    networks:
      - dev-network
    depends_on:
      - chromadb-dev
      - nucleus-dev

  realtime-dev:
    image: noamanfaisal/nexus-transport:6.0
    profiles: ["dev"]
    container_name: dev-transport
    environment:
      - CENTRIFUGO_HTTP_API_KEY=${DEV_CENTRIFUGO_API_KEY}
      - CENTRIFUGO_ALLOWED_ORIGINS=${DEV_NEURALOPS_SERVER_URL}
    command: >
      nexus-transport
      --admin.enabled
      --admin.insecure
      --client.insecure
      --http_api.insecure
    networks:
      - dev-network
    depends_on:
      - redis-dev

  nginx-dev:
    image: nginx:alpine
    profiles: ["dev"]
    container_name: dev-nginx
    restart: unless-stopped
    ports:
      - "${DEV_NGINX_HOST_PORT:-8081}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - dev-network
    depends_on:
      - nucleus-dev
      - realtime-dev

  chromadb-dev:
    image: chromadb/chroma:latest
    profiles: ["dev"]
    container_name: dev-chroma
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      - ./data/dev/chroma_data:/chroma/chroma
    networks:
      - dev-network

  postgres-dev:
    image: postgres:17-alpine
    profiles: ["dev"]
    container_name: dev-postgres
    restart: always
    environment:
      - POSTGRES_DB=${DEV_POSTGRES_DB}
      - POSTGRES_USER=${DEV_POSTGRES_USER}
      - POSTGRES_PASSWORD=${DEV_POSTGRES_PASSWORD}
    ports:
      - "${DEV_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./data/dev/postgres_data:/var/lib/postgresql/data
    networks:
      - dev-network

  # -- First-party MCP addons (#150) -- each is its own real MCP server:
  # own process, own container, own <container-name>:8000/mcp endpoint.
  # Not mounted together under one shared server -- see modules/nexus-mcp/
  # server.py's docstring for why.
  #
  # Scope trimmed to just Filesystem + GitHub for now to test that pair
  # cleanly end-to-end (2026-08-10). mcp-shopping-dev/mcp-erp-dev/mcp-ssh-dev
  # are NOT deleted -- server_shopping.py/server_erp.py/server_ssh.py and
  # their tools/*.py still exist in modules/nexus-mcp/, just not wired into
  # this compose file right now. Re-add the same service blocks (removed
  # from here, still in git history) when it's their turn -- see TASKS.md #150.

  mcp-github-dev:
    # GitHub gets its own addon container (unlike Filesystem below) because
    # its official open-source server is a compiled Go binary, not something
    # reachable via a plain npx/ssh one-liner. Building that binary lives in
    # THIS image's Dockerfile only -- nexus-ai never needs a Go toolchain,
    # it just connects to this container's :8000/mcp like any other
    # HTTP-transport MCP server. See modules/nexus-mcp/server_github.py and
    # TASKS.md #150/#182.
    build:
      context: ./modules/nexus-mcp
      dockerfile: ./Dockerfile
    profiles: ["dev"]
    container_name: dev-mcp-github
    command: ["python", "server_github.py"]
    # No source bind mount here on purpose -- the compiled github-mcp-server
    # binary lives at /usr/local/bin, outside /app, but re-mounting /app
    # over the built image would still be pointless for this addon (no
    # local Python tool code to hot-reload, it's a pure proxy).
    ports:
      - "${DEV_MCP_GITHUB_HOST_PORT:-8024}:8000"
    environment:
      - GITHUB_PERSONAL_ACCESS_TOKEN=${DEV_GITHUB_PERSONAL_ACCESS_TOKEN:-}
    networks:
      - dev-network
    restart: unless-stopped

  # No mcp-filesystem-dev service -- Filesystem access doesn't need its own
  # server/container. nexus-ai's existing stdio transport path already
  # spawns an arbitrary command directly (see pydantic_ai_runner.py); a
  # Filesystem MCP server is just an MCPServer row with transport=stdio and
  # command="ssh -i <key> <user>@<host> 'npx @modelcontextprotocol/server-filesystem <path>'",
  # registered the same way as any other MCP server. See TASKS.md #150.

  react-app-dev:
    build:
      context: ./modules/neuralops-react-app
      dockerfile: Dockerfile
    profiles: ["dev"]
    container_name: dev-react-app
    restart: unless-stopped
    ports:
      - "${DEV_REACT_HOST_PORT:-3003}:3000"
    environment:
      - VITE_SUPABASE_URL=${DEV_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${DEV_SUPABASE_ANON_KEY}
    volumes:
      - ./modules/neuralops-react-app:/app
      - dev_react_node_modules:/app/node_modules
    networks:
      - dev-network
    depends_on:
      - nucleus-dev

  # ===========================================================================
  # FAT profile (#170) — pre-built Docker Hub images, no source tree needed.
  # No frontend service here on purpose — see the note at the top of this file.
  # ===========================================================================

  nucleus-fat:
    image: noamanfaisal/neuralops-nucleus:${FAT_VERSION:-0.1.1}
    profiles: ["fat"]
    container_name: fat-nucleus
    command: >-
      uvicorn core.asgi:application
      --host 0.0.0.0
      --port 8000
      --workers 2
    environment:
      - POSTGRES_USER=${FAT_POSTGRES_USER}
      - POSTGRES_PASSWORD=${FAT_POSTGRES_PASSWORD}
      - POSTGRES_DB=${FAT_POSTGRES_DB}
      - POSTGRES_URL=${FAT_POSTGRES_URL}
      - POSTGRES_HOST=postgres-fat
      - NEXUS_AI_URL=http://nexus-ai-fat:8000
      - FIELD_ENCRYPTION_KEY=${FAT_FIELD_ENCRYPTION_KEY}
      - INTERNAL_API_KEY=${FAT_INTERNAL_API_KEY}
      - CENTRIFUGO_API_URL=http://realtime-fat:8000/api
      - CENTRIFUGO_API_KEY=${FAT_CENTRIFUGO_API_KEY}
      - CENTRIFUGO_HMAC_SECRET=${FAT_CENTRIFUGO_HMAC_SECRET}
      - REDIS_URL=redis://redis-fat:6379/0
      - SUPABASE_ANON_KEY=${FAT_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${FAT_SUPABASE_SERVICE_KEY}
      - NEURALOPS_INSTALL_TOKEN=${FAT_NEURALOPS_INSTALL_TOKEN}
      - NEURALOPS_PORTAL_URL=${FAT_NEURALOPS_PORTAL_URL:-https://neuralops-nexus-auth.mapax.io}
      - NEURALOPS_SERVER_URL=${FAT_NEURALOPS_SERVER_URL}
      - NEURALOPS_VERSION=${FAT_VERSION:-0.1.1}
    networks:
      - fat-network
    depends_on:
      - postgres-fat
      - redis-fat
      - realtime-fat

  nucleus-celery-fat:
    image: noamanfaisal/neuralops-nucleus:${FAT_VERSION:-0.1.1}
    profiles: ["fat"]
    container_name: fat-celery
    command: tail -f /dev/null
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${FAT_POSTGRES_USER}
      - POSTGRES_PASSWORD=${FAT_POSTGRES_PASSWORD}
      - POSTGRES_DB=${FAT_POSTGRES_DB}
      - POSTGRES_URL=${FAT_POSTGRES_URL}
      - POSTGRES_HOST=postgres-fat
      - REDIS_URL=redis://redis-fat:6379/0
      - SUPABASE_ANON_KEY=${FAT_SUPABASE_ANON_KEY}
      - NEURALOPS_INSTALL_TOKEN=${FAT_NEURALOPS_INSTALL_TOKEN}
    networks:
      - fat-network
    depends_on:
      - postgres-fat
      - redis-fat

  redis-fat:
    image: redis:7-alpine
    profiles: ["fat"]
    container_name: fat-redis
    restart: unless-stopped
    ports:
      - "${FAT_REDIS_HOST_PORT:-6390}:6379"
    volumes:
      - ./data/fat/redis_data:/data
    networks:
      - fat-network

  nexus-ai-fat:
    image: noamanfaisal/neuralops-nexus-ai:${FAT_VERSION:-0.1.1}
    profiles: ["fat"]
    container_name: fat-nexus-ai
    ports:
      - "${FAT_NEXUS_AI_HOST_PORT:-8010}:8000"
    volumes:
      - ./data/fat/fastembed_cache:/root/.cache/fastembed
    environment:
      - CHROMA_HOST=chromadb-fat
      - CHROMA_PORT=8000
      - OPENAI_API_KEY=${FAT_OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${FAT_ANTHROPIC_API_KEY}
      - LLM_MODEL=${FAT_LLM_MODEL:-anthropic/claude-haiku-4-5-20251001}
      - EMBEDDING_PROVIDER=${FAT_EMBEDDING_PROVIDER:-fastembed}
      - EMBEDDING_MODEL=${FAT_EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      - EMBEDDING_BASE_URL=${FAT_EMBEDDING_BASE_URL:-}
      - INTERNAL_API_KEY=${FAT_INTERNAL_API_KEY}
      - NEXUS_NUCLEUS_URL=http://nucleus-fat:8000
    networks:
      - fat-network
    depends_on:
      - chromadb-fat
      - nucleus-fat

  realtime-fat:
    image: noamanfaisal/nexus-transport:6.0
    profiles: ["fat"]
    container_name: fat-transport
    environment:
      - CENTRIFUGO_HTTP_API_KEY=${FAT_CENTRIFUGO_API_KEY}
      - CENTRIFUGO_ALLOWED_ORIGINS=${FAT_NEURALOPS_SERVER_URL}
    command: >
      nexus-transport
      --admin.enabled
      --admin.insecure
      --client.insecure
      --http_api.insecure
    networks:
      - fat-network
    depends_on:
      - redis-fat

  nginx-fat:
    image: noamanfaisal/neuralops-nginx:${FAT_VERSION:-0.1.1}
    profiles: ["fat"]
    container_name: fat-nginx
    restart: unless-stopped
    ports:
      - "${FAT_NGINX_HOST_PORT:-8090}:80"
    networks:
      - fat-network
    depends_on:
      - nucleus-fat
      - realtime-fat

  chromadb-fat:
    image: chromadb/chroma:latest
    profiles: ["fat"]
    container_name: fat-chroma
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      - ./data/fat/chroma_data:/chroma/chroma
    networks:
      - fat-network

  postgres-fat:
    image: postgres:17-alpine
    profiles: ["fat"]
    container_name: fat-postgres
    restart: always
    environment:
      - POSTGRES_DB=${FAT_POSTGRES_DB}
      - POSTGRES_USER=${FAT_POSTGRES_USER}
      - POSTGRES_PASSWORD=${FAT_POSTGRES_PASSWORD}
    ports:
      - "${FAT_POSTGRES_HOST_PORT:-5440}:5432"
    volumes:
      - ./data/fat/postgres_data:/var/lib/postgresql/data
    networks:
      - fat-network

networks:
  dev-network:
    name: dev-network
    driver: bridge
  fat-network:
    name: fat-network
    driver: bridge

volumes:
  dev_react_node_modules:
