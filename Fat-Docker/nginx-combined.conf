# Fat-Docker/nginx-combined.conf
#
# Single-container variant of docker/fat/nginx.conf. Everything nginx
# proxies to (nucleus, nexus-transport) now runs as sibling processes in
# the SAME container instead of separate ones on the fat-network, so:
#   - upstreams are 127.0.0.1:<port>, not Docker-DNS service names
#   - no `resolver` directive needed -- that was only there to defer DNS
#     lookups for Docker's internal DNS; a literal 127.0.0.1 needs no
#     lookup at all
#   - nucleus and nexus-transport can no longer both default to :8000
#     (that was fine as separate containers, not as one) -- nexus-transport
#     moves to :8001 here; make sure whatever starts it is actually told
#     to listen on 8001, not its old default
#
# Master process starts as root (needed to bind low ports, though this
# config uses 8080 -- see Dockerfile.nexus EXPOSE), worker processes drop
# to the `nexus` user via the line below. Standard nginx behavior, same
# as the official nginx image.
user nexus;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 50m;

    server {
        listen 8080;

        # ── Django REST API ─────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://127.0.0.1:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            add_header 'Access-Control-Allow-Private-Network' 'true' always;
        }

        # ── Django media ────────────────────────────────────────────────────
        location /media/ {
            proxy_pass         http://127.0.0.1:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Django admin ────────────────────────────────────────────────────
        location /admin/ {
            proxy_pass         http://127.0.0.1:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Centrifugo WebSocket ─────────────────────────────────────────────
        # nexus-transport must be started listening on 8001 for this to work.
        location /connection/websocket {
            proxy_pass             http://127.0.0.1:8001;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host       $host;
            proxy_set_header       Origin     "";   # strip — bypasses nexus-transport origin check
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
        }

        # ── Centrifugo SSE fallback ──────────────────────────────────────────
        location /connection/sse {
            proxy_pass             http://127.0.0.1:8001;
            proxy_http_version     1.1;
            proxy_set_header       Host       $host;
            proxy_set_header       Origin     "";   # strip — same reason
            proxy_read_timeout     3600s;
            proxy_buffering        off;
        }
    }
}
